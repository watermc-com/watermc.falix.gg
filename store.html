<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Ranks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

:root{
--aqua:#00FFFF;
--gold:#FFD700;
--dark:#1a1a1a;
--light:#2b2b2b;
--red:#8B0000;
--text:#e0e0e0;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Cinzel',serif;
background:#0f0f0f;
background-image:radial-gradient(circle,#2c2c2c,#0f0f0f);
color:var(--text);
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}

header{
text-align:center;
padding:40px 20px;
border-bottom:2px solid #008b8b;
width:100%;
}

h1{
font-family:'Press Start 2P',cursive;
color:var(--aqua);
font-size:2rem;
text-shadow:4px 4px 0px #005f5f;
margin-bottom:10px;
}

.subtitle{
letter-spacing:3px;
color:#aaa;
}

.main-layout{
max-width:1200px;
width:100%;
padding:40px 20px;
}

.section-title{
color:var(--gold);
margin-bottom:20px;
border-left:5px solid var(--aqua);
padding-left:15px;
font-size:1.5rem;
}

.rank-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.rank-item{
background:var(--dark);
border:2px solid #444;
padding:20px;
border-radius:6px;
text-align:center;
transition:0.3s;
}

.rank-item:hover{
border-color:var(--aqua);
transform:translateY(-5px);
box-shadow:0 5px 15px rgba(0,255,255,0.2);
}

.rank-name{
font-size:1.4rem;
margin-bottom:10px;
font-weight:bold;
}

.rank-price{
color:var(--gold);
font-family:'Press Start 2P';
font-size:0.8rem;
margin-bottom:15px;
}

.btn-buy{
background:transparent;
border:2px solid var(--gold);
color:var(--gold);
padding:10px;
width:100%;
font-weight:bold;
cursor:pointer;
transition:0.2s;
text-transform:uppercase;
}

.btn-buy:hover{
background:var(--gold);
color:black;
box-shadow:0 0 10px var(--gold);
}

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:1000;
}

.modal-overlay.active{
opacity:1;
visibility:visible;
}

.modal-content{
background:var(--light);
border:4px double var(--gold);
padding:40px;
width:90%;
max-width:500px;
text-align:center;
border-radius:6px;
position:relative;
}

.close-btn{
position:absolute;
top:10px;
right:15px;
font-size:2rem;
cursor:pointer;
color:#777;
}

.close-btn:hover{
color:red;
}

.modal-title{
color:var(--gold);
margin-bottom:20px;
}

.discord-btn{
background:#5865F2;
border:2px solid white;
color:white;
padding:15px;
width:100%;
font-size:1.1rem;
cursor:pointer;
transition:0.2s;
margin-top:20px;
}

.discord-btn:hover{
background:#4752C4;
box-shadow:0 0 15px #5865F2;
}

</style>
</head>

<body>

<header>
<h1>WaterMC</h1>
<div class="subtitle">Official Server Store</div>
</header>

<div class="main-layout">

<h2 class="section-title">Select Your Rank</h2>

<div class="rank-grid" id="rankGrid"></div>

</div>


<!-- Checkout Popup -->

<div class="modal-overlay" id="checkoutModal">

<div class="modal-content">

<span class="close-btn" onclick="closeCheckout()">&times;</span>

<h2 class="modal-title">Finalize Purchase</h2>

<p style="color:#ccc;margin-bottom:15px;">
To complete your order please create a ticket on our Discord.
</p>

<p style="color:var(--aqua);font-weight:bold;">
Click below to open the ticket channel.
</p>

<button class="discord-btn" onclick="redirectDiscord()">
Create Kit Ticket
</button>

</div>
</div>


<script>

const ranks=[

{id:1,name:"<span style='color:black'>Coal Rank</span>",price:7.99},

{id:2,name:"<span style='color:gold'>Gold Rank</span>",price:10.99},

{id:3,name:"<span style='color:aqua'>Diamond Rank</span>",price:16.99},

{id:4,name:"<span style='color:lime'>Emerald Rank</span>",price:20.99},

{id:5,name:"<span style='color:gray'>Netherite Rank</span>",price:25.99}

];


const grid=document.getElementById("rankGrid");

ranks.forEach(rank=>{

const card=document.createElement("div");

card.className="rank-item";

card.innerHTML=`

<div class="rank-name">${rank.name}</div>

<div class="rank-price">$${rank.price}</div>

<button class="btn-buy" onclick="buyNow(${rank.id})">Buy Now</button>

`;

grid.appendChild(card);

});


function buyNow(id){

const rank=ranks.find(r=>r.id===id);

const username=prompt("Enter your Minecraft Username:");

if(!username) return;

const confirmBuy=confirm(`Buy ${rank.name} for $${rank.price}?`);

if(confirmBuy){

document.getElementById("checkoutModal").classList.add("active");

}

}


function closeCheckout(){

document.getElementById("checkoutModal").classList.remove("active");

}


function redirectDiscord(){

window.location.href="https://discord.gg/JrAtNSZwwe";

}

</script>

</body>
</html>
