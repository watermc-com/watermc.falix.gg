<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Ranks</title>
<style>
body { font-family: Arial,sans-serif; background:#0f0f0f; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { color:#00FFFF; margin-top:20px; }
.rank-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin:20px; max-width:1200px; }
.rank-item { background:#1a1a1a; padding:20px; border-radius:10px; text-align:center; cursor:pointer; }
.rank-item:hover { border:2px solid #00FFFF; }
.btn-buy { padding:10px; width:100%; background:#333; border:none; color:white; cursor:pointer; margin-top:10px; }
.btn-buy:hover { background:#00FFFF; color:black; }
</style>
</head>
<body>

<h1>WaterMC Store</h1>
<div class="rank-grid" id="rankGrid"></div>

<script>
const ranks = [
  {id:1,name:"Coal Rank",price:7.99,emoji:"⚒️"},
  {id:2,name:"Gold Rank",price:10.99,emoji:"🟡"},
  {id:3,name:"Diamond Rank",price:16.99,emoji:"💎"},
  {id:4,name:"Emerald Rank",price:20.99,emoji:"💚"},
  {id:5,name:"Netherite Rank",price:25.99,emoji:"⬛"}
];

const grid = document.getElementById("rankGrid");
const discordUser = localStorage.getItem("discordUser") || "Unknown User";

ranks.forEach(rank => {
  const div = document.createElement("div");
  div.className = "rank-item";
  div.innerHTML = `
    <h3>${rank.emoji} ${rank.name}</h3>
    <p>Price: $${rank.price}</p>
    <button class="btn-buy" onclick="buyNow(${rank.id})">Buy Now</button>
  `;
  grid.appendChild(div);
});

function buyNow(id){
  const rank = ranks.find(r => r.id===id);
  const mcUser = prompt("Enter your Minecraft username:");
  if(!mcUser){ alert("Minecraft username required!"); return; }
  if(!confirm(`Buy ${rank.name} for $${rank.price}?`)) return;

  let orderCount = parseInt(localStorage.getItem("watermc_orders")||0);
  orderCount++; localStorage.setItem("watermc_orders", orderCount);
  const orderID = "WM-"+orderCount;

  fetch("YOUR_DISCORD_WEBHOOK_URL", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      content:`<@&YOUR_ROLE_ID>, New Store Purchase!`,
      embeds:[{
        title:"🎉 WaterMC Purchase!",
        color:3447003,
        fields:[
          {name:"👤 Discord User", value:discordUser, inline:true},
          {name:"🎮 Minecraft Username", value:mcUser, inline:true},
          {name:`Rank`, value:rank.name, inline:true},
          {name:"💰 Price", value:`$${rank.price}`, inline:true},
          {name:"🆔 Order ID", value:orderID, inline:false}
        ],
        footer:{text:"WaterMC Store • Thank you!"},
        timestamp:new Date()
      }]
    })
  }).then(res=>{
    if(res.ok) alert(`✅ Order ${orderID} sent!`);
    else alert("❌ Failed to send order.");
  }).catch(err=>alert("❌ Error: "+err));
}
</script>

</body>
</html>
