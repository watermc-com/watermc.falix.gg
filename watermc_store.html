<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Medieval Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body { font-family:'Cinzel', serif; background:#0f0f0f; color:#e0e0e0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
header { text-align:center; padding:40px 20px; }
h1 { font-family:'Press Start 2P', cursive; color:#00FFFF; font-size:2.5rem; margin-bottom:10px; text-shadow: 0 0 10px #00FFFF; }
.subtitle { font-size:1.2rem; color:#aaa; text-transform:uppercase; letter-spacing:3px; border-bottom:2px solid #8B0000; padding-bottom:5px; }
.store-container { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; max-width:1200px; width:100%; padding:20px; }
.card { background:#1a1a1a; border:4px solid #444; border-radius:8px; width:300px; padding:30px; text-align:center; transition:0.3s; box-shadow:0 10px 20px rgba(0,0,0,0.7); cursor:pointer; }
.card:hover { transform:translateY(-10px); border-color:#00FFFF; box-shadow:0 0 15px #00FFFF; }
.icon { font-size:4rem; margin-bottom:20px; display:block; }
.card h2 { color:#FFD700; margin-bottom:15px; font-weight:700; }
.card p { margin-bottom:25px; line-height:1.5; color:#ccc; }
.btn { background:#333; color:white; border:2px solid #FFD700; padding:12px 25px; font-weight:bold; font-size:1rem; cursor:pointer; width:100%; }
.btn:hover { background:#FFD700; color:black; box-shadow:0 0 10px #FFD700; }
</style>
</head>
<body>

<header>
<h1>WaterMC</h1>
<div class="subtitle">Royal Store</div>
</header>

<div class="store-container">
  <div class="card" onclick="redirectDiscord()">
    <span class="icon">👑</span>
    <h2>Buy Ranks</h2>
    <p>Ascend the hierarchy. Unlock perks and fly rights.</p>
    <button class="btn">Buy Rank</button>
  </div>
  <div class="card" onclick="redirectDiscord()">
    <span class="icon">💰</span>
    <h2>Buy Coins</h2>
    <p>Acquire the currency of the realm.</p>
    <button class="btn">Buy Coins</button>
  </div>
</div>

<script>
const CLIENT_ID = "1482983042527264920";
const REDIRECT_URI = "https://watermc-store.onrender.com/auth";

function redirectDiscord() {
  const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=identify`;
  window.location.href = url;
}
</script>

</body>
</html>
