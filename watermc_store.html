<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Medieval Market</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root {
  --aqua: #00FFFF;
  --gold: #FFD700;
  --dark: #1a1a1a;
  --text: #e0e0e0;
}

body {
  font-family:'Cinzel', serif;
  background:#0f0f0f;
  color: var(--text);
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 40px 20px;
}

h1 { font-family:'Press Start 2P',cursive; color:var(--aqua); font-size:2.5rem; margin-bottom:10px; }
.subtitle { color:#aaa; margin-bottom:30px; letter-spacing:3px; }

.rank-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; width:100%; max-width:1200px; }

.rank-item {
  background: var(--dark); border:2px solid #444; padding:20px; border-radius:6px;
  text-align:center; transition:0.3s; cursor:pointer;
}

.rank-item:hover { border-color:var(--aqua); transform:translateY(-5px); }

.rank-name{ font-size:1.4rem; font-weight:bold; margin-bottom:10px; }
.rank-price{ color:var(--gold); margin-bottom:15px; font-family:'Press Start 2P'; font-size:0.9rem; }
.btn-buy{ background:transparent; border:2px solid var(--gold); color:var(--gold); padding:10px; width:100%; font-weight:bold; cursor:pointer; }
.btn-buy:hover{ background:var(--gold); color:black; }
</style>
</head>
<body>

<h1>WaterMC</h1>
<div class="subtitle">Official Server Store</div>

<div class="rank-grid" id="rankGrid"></div>

<script>
// Rank data
const ranks = [
  {id:1,name:"Coal Rank",color:"black",price:7.99,emoji:"⚒️"},
  {id:2,name:"Gold Rank",color:"gold",price:10.99,emoji:"🟡"},
  {id:3,name:"Diamond Rank",color:"aqua",price:16.99,emoji:"💎"},
  {id:4,name:"Emerald Rank",color:"lime",price:20.99,emoji:"💚"},
  {id:5,name:"Netherite Rank",color:"gray",price:25.99,emoji:"⬛"}
];

const grid = document.getElementById("rankGrid");
ranks.forEach(rank=>{
  const card=document.createElement("div");
  card.className="rank-item";
  card.innerHTML=`
    <div class="rank-name" style="color:${rank.color}">${rank.name}</div>
    <div class="rank-price">$${rank.price}</div>
    <button class="btn-buy" onclick="buyNow(${rank.id})">Buy Now</button>
  `;
  grid.appendChild(card);
});

// Get Discord username from OAuth
const discordUser = localStorage.getItem("discordUser") || "Unknown User";

// Buy function
function buyNow(id){
  const rank = ranks.find(r=>r.id===id);
  const mcUser = prompt("Enter your Minecraft username:");
  if(!mcUser){ alert("Minecraft username required!"); return; }
  const confirmBuy = confirm(`Buy ${rank.name} for $${rank.price}?`);
  if(!confirmBuy) return;

  let orderCount=parseInt(localStorage.getItem("watermc_orders")||0);
  orderCount++;
  localStorage.setItem("watermc_orders", orderCount);
  const orderID="WM-"+orderCount;

  fetch("YOUR_DISCORD_WEBHOOK_URL", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      content:`<@&YOUR_STAFF_ROLE_ID> New Store Purchase! 🚀`,
      embeds:[{
        title:`🎉 WaterMC Purchase!`,
        color:3447003,
        fields:[
          {name:"👤 Discord User", value:discordUser, inline:true},
          {name:"🎮 Minecraft Username", value:mcUser, inline:true},
          {name:`${rank.emoji} Rank`, value:rank.name, inline:true},
          {name:"💰 Price", value:`$${rank.price}`, inline:true},
          {name:"🆔 Order ID", value:orderID, inline:false}
        ],
        footer:{text:"WaterMC Store • Thank you for your purchase! ✨"},
        timestamp: new Date()
      }]
    })
  })
  .then(res=>res.ok ? alert(`✅ Order ${orderID} sent! Staff notified.`) : alert("❌ Failed to send order."))
  .catch(err=>alert("❌ Error: "+err));
}
</script>

</body>
</html>
