<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Medieval Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root {
    --aqua: #00FFFF;
    --gold: #FFD700;
    --stone-dark: #1a1a1a;
    --stone-light: #2b2b2b;
    --red-accent: #8B0000;
}

body {
    font-family: 'Cinzel', serif;
    background-color: #0f0f0f;
    background-image: radial-gradient(circle at center, #2c2c2c 0%, #0f0f0f 100%);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

header { 
    text-align: center; 
    padding: 40px 20px; 
}

h1 { 
    font-family: 'Press Start 2P', cursive; 
    color: var(--aqua); 
    text-shadow: 4px 4px 0px #005f5f; 
    font-size: 2.5rem; 
    margin-bottom: 10px; 
}

.subtitle { 
    font-size: 1.2rem; 
    color: #aaa; 
    text-transform: uppercase; 
    letter-spacing: 3px; 
    border-bottom: 2px solid var(--red-accent); 
    padding-bottom: 5px; 
}

.store-container { 
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 30px; 
    max-width: 1200px; 
    width: 100%; 
    padding: 20px; 
}

.card { 
    background: var(--stone-dark); 
    border: 4px solid #444; 
    border-radius: 8px; 
    width: 300px; 
    padding: 30px; 
    text-align: center; 
    transition: 0.3s; 
    position: relative; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.7); 
    cursor: pointer; 
}

.card:hover { 
    transform: translateY(-10px); 
    border-color: var(--aqua); 
    box-shadow: 0 0 15px var(--aqua); 
}

.icon { 
    font-size: 4rem; 
    margin-bottom: 20px; 
    display: block; 
}

.card h2 { 
    color: var(--gold); 
    margin-bottom: 15px; 
    font-weight: 700; 
}

.card p { 
    margin-bottom: 25px; 
    line-height: 1.5; 
    color: #ccc; 
}

.btn { 
    background: #333; 
    color: white; 
    border: 2px solid var(--gold); 
    padding: 12px 25px; 
    font-family: 'Cinzel', serif; 
    font-weight: bold; 
    font-size: 1rem; 
    cursor: pointer; 
    text-transform: uppercase; 
    transition: all 0.2s; 
    width: 100%; 
}

.btn:hover { 
    background: var(--gold); 
    color: black; 
    box-shadow: 0 0 10px var(--gold); 
}
</style>
</head>
<body>

<header>
<h1>WaterMC</h1>
<div class="subtitle">Royal Store</div>
</header>

<div class="store-container">

<!-- Buy Ranks -->
<div class="card" onclick="redirectDiscord()">
<span class="icon">👑</span>
<h2>Buy Ranks</h2>
<p>Ascend the hierarchy. Unlock perks and fly rights.</p>
<button class="btn">Buy Rank</button>
</div>

<!-- Buy Coins -->
<div class="card" onclick="redirectDiscord()">
<span class="icon">💰</span>
<h2>Buy Coins</h2>
<p>Acquire the currency of the realm.</p>
<button class="btn">Buy Coins</button>
</div>

</div>

<script>
const CLIENT_ID = "1482983042527264920";
const REDIRECT_URI = "https://watermc-store.onrender.com/auth";

function redirectDiscord() {
    const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=identify`;
    window.location.href = url;
}
</script>

</body>
</html>
