<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterMC Store | Medieval Market</title>
<style>
body { font-family: Arial,sans-serif; text-align:center; background:#0f0f0f; color:#fff; display:flex; flex-direction:column; justify-content:center; min-height:100vh; }
h1 { color:#00FFFF; font-size:2.5rem; }
.card { background:#1a1a1a; padding:20px; margin:20px auto; border-radius:10px; width:300px; cursor:pointer; }
.card:hover { border:2px solid #00FFFF; }
.btn { padding:10px 20px; background:#333; color:white; border:none; cursor:pointer; margin-top:10px; }
.btn:hover { background:#00FFFF; color:black; }
</style>
</head>
<body>

<h1>WaterMC Store</h1>
<p>Click below to login with Discord and continue to the store</p>

<div class="card" onclick="redirectDiscord()">
  <h2>Buy Ranks / Coins</h2>
  <button class="btn">Login with Discord</button>
</div>

<script>
const CLIENT_ID = "1482983042527264920";
const REDIRECT_URI = "https://watermc-store.onrender.com/auth";

function redirectDiscord() {
  const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=identify`;
  window.location.href = url;
}
</script>

</body>
</html>
